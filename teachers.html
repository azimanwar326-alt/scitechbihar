<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers - SciTech Bihar</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#1565c0;
    margin-bottom:30px;
}

#teacherContainer{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card h2{
    color:#1565c0;
    margin-top:0;
}

.card p{
    margin:8px 0;
}

.whatsapp-btn{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    background:#25d366;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.whatsapp-btn:hover{
    background:#128c7e;
}

#searchInput{
width:100%;
max-width:500px;
display:block;
margin:0 auto 25px;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}


.back-btn{
padding:10px 18px;
background:#1565c0;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:20px;
}

</style>
</head>

<body>

<h1>Our Teachers</h1>

<input
  type="text"
  id="searchInput"
  placeholder="Search Subject (Math, Science, English...)"
>

<div id="teacherContainer"></div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// Firebase Config

const firebaseConfig = {

apiKey: "AIzaSyDZUuQ1xid9vcKryIWi5rmM13Pq-tioyow",

authDomain: "scitechbihar-academy.firebaseapp.com",

databaseURL: "https://scitechbihar-academy-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId: "scitechbihar-academy",

storageBucket: "scitechbihar-academy.appspot.com",

messagingSenderId: "489533985206",

appId: "1:489533985206:web:ed29ff09b109272f543117"

};


// Initialize Firebase

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// Fetch Teachers

const teacherContainer = document.getElementById("teacherContainer");

const searchInput = document.getElementById("searchInput");


const teacherRef = ref(db, "teachers");

onValue(teacherRef, (snapshot)=>{

teacherContainer.innerHTML = "";

snapshot.forEach((childSnapshot)=>{

const teacher = childSnapshot.val();

teacherContainer.innerHTML += `

<div class="card" data-subject="${teacher.subject}">

<h2>${teacher.name}</h2>

<p><strong>Subject:</strong> ${teacher.subject}</p>

<p><strong>Qualification:</strong> ${teacher.qualification}</p>

<p><strong>Experience:</strong> ${teacher.experience} Years</p>

<p><strong>Classes:</strong> ${teacher.classes}</p>

<p><strong>Medium:</strong> ${teacher.medium}</p>

<a class="whatsapp-btn"
href="https://wa.me/91${teacher.whatsapp}"
target="_blank">

Contact on WhatsApp

</a>

</div>

`;

});

});

searchInput.addEventListener("keyup", () => {

    const value = searchInput.value.toLowerCase();

    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        const subject = card
            .getAttribute("data-subject")
            .toLowerCase();

        if(subject.includes(value)){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }

    });

});

</script>
<button onclick="history.back()" class="back-btn">
← Back
</button>
</body>
</html>
