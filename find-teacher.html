<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request a Teacher</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1565c0;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

textarea{
    height:100px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

.back-btn{
    width:auto;
    padding:10px 18px;
    margin-bottom:20px;
}

#msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<button onclick="history.back()" class="back-btn">
← Back
</button>

<div class="container">

<h1>
<h1>Find a Teacher</h1>
</h1>

<form id="requestForm">

<input type="text"
id="studentName"
placeholder="Student Name"
required>

<input type="text"
id="parentName"
placeholder="Parent Name"
required>

<input type="text"
id="className"
placeholder="Class"
required>

<input type="text"
id="subject"
placeholder="Required Subject"
required>

<select id="medium" required>
<option value="">Select Medium</option>
<option>Hindi</option>
<option>English</option>
<option>Bilingual</option>
</select>

<input type="text"
id="whatsapp"
placeholder="WhatsApp Number"
required>

<textarea
id="message"
placeholder="Additional Requirements">
</textarea>

<button type="submit">
Submit Request
</button>

</form>

<p id="msg"></p>

</div>

subject:

medium:

whatsapp:

message:

};

push(ref(db, "parentRequests"), requestData)

.then(()=>{

document.getElementById("msg").innerHTML =
"Request Submitted Successfully!";

form.reset();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

});

</script>

</body>
</html>
