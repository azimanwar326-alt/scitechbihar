<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#1565c0;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}

.back-btn{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#6c757d;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.back-btn:hover{
    background:#5a6268;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">
Login
</button>


<button onclick="history.back()" class="back-btn">
← Back
</button>

<p id="error"></p>

<p id="error"></p>

</div>

<script>

function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
username === "admin" &&
password === "scitech123"
){

localStorage.setItem("adminLoggedIn","true");

window.location.href = "admin.html";

}
else{

document.getElementById("error").innerHTML =
"Invalid Username or Password";

}

}

</script>

</button>


</body>
</html>
