<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join as Teacher</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    background:white;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1565c0;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#1565c0;
    color:white;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

#msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Join as Teacher</h1>

<form id="teacherForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="subject" placeholder="Subject" required>

<input type="text" id="qualification" placeholder="Qualification" required>

<input type="number" id="experience" placeholder="Experience (Years)" required>

<input type="text" id="classes" placeholder="Classes You Teach" required>

<select id="medium" required>
<option value="">Select Medium</option>
<option>Hindi</option>
<option>English</option>
<option>Bilingual</option>
</select>

<input type="text" id="whatsapp" placeholder="WhatsApp Number" required>

<input type="url" id="demo" placeholder="Demo Video Link">

<button type="submit">Submit</button>

</form>

<p id="msg"></p>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getDatabase,
ref,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// Firebase Config

const firebaseConfig = {

apiKey:"AIzaSyDZUuQ1xid9vcKryIWi5rmM13Pq-tioyow",

authDomain: "scitechbihar-academy.firebaseapp.com",

databaseURL:  "https://scitechbihar-academy-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId: "scitechbihar-academy",

storageBucket: "scitechbihar-academy.appspot.com",

messagingSenderId: "489533985206",

appId:"1:489533985206:web:ed29ff09b109272f543117",
};


// Initialize Firebase

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// Form Submit

const form = document.getElementById("teacherForm");

form.addEventListener("submit", function(e){

e.preventDefault();

const teacherData = {

name: document.getElementById("name").value,

subject: document.getElementById("subject").value,

qualification: document.getElementById("qualification").value,

experience: document.getElementById("experience").value,

classes: document.getElementById("classes").value,

medium: document.getElementById("medium").value,

whatsapp: document.getElementById("whatsapp").value,

demo: document.getElementById("demo").value

};


// Save Data

push(ref(db, "teachers"), teacherData)

.then(()=>{

document.getElementById("msg").innerHTML =
"Teacher Registered Successfully!";

form.reset();

})

.catch((error)=>{

document.getElementById("msg").innerHTML =
error.message;

});

});

</script>
<button onclick="history.back()" class="back-btn">
← Back
</button>
</body>
</html>
