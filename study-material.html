    <script>
        // सर्च फिल्टर काम करने के लिए छोटा सा फंक्शन
        function filterLetters() {
            let input = document.getElementById('letterSearch');
            let filter = input.value.toUpperCase();
            let table = document.getElementById('lettersTable');
            let tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName('td')[1]; // विषय वाला कॉलम
                if (td) {
                    let textValue = td.textContent || td.innerText;
                    if (textValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }
    </script>
