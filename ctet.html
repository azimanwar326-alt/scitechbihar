<style>

body{

/* Different Colors */

.english{ background:#009688; }

  .card-container{
    flex-direction:column;
    align-items:center;
  }

  .card{
    width:85%;
    max-width:300px;
    padding:20px;
    font-size:20px;
  }

}

a{
  display:inline-block;
  margin-top:30px;
